#####################################
# DISEASE
#####################################
- name: ncbi-disease.ctd-diseases
  kb: ctd-diseases
  corpus: ncbi-disease
  corpus_args:
    id_mapping: ctd-diseases

- name: ncbi-disease.mesh
  kb: mesh
  kb_args:
    branches:
      - C
      - F03
  corpus: ncbi-disease
  corpus_args:
    id_mapping: mesh[C,F03]

- name: bc5cdr-disease.ctd-diseases
  kb: ctd-diseases
  corpus: bc5cdr
  corpus_args:
    entity_types:
      - disease
    id_mapping: ctd-diseases

- name: bc5cdr-disease.mesh
  kb: mesh
  kb_args:
    branches:
      - C
      - F03
  corpus: bc5cdr
  corpus_args:
    entity_types:
      - disease
    id_mapping: mesh[C,F03]


