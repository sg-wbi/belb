#####################################
# CHEMICAL
#####################################

- name: bc5cdr-chemical.ctd-chemicals
  kb: ctd-chemicals
  corpus: bc5cdr
  corpus_args:
    entity_types:
      - chemical
    id_mapping: ctd-chemicals

- name: bc5cdr-chemical.mesh
  kb: mesh
  kb_args:
    branches:
      - D
  corpus: bc5cdr
  corpus_args:
    entity_types:
      - chemical
    id_mapping: mesh[D]

- name: nlm-chem.ctd-chemicals
  kb: ctd-chemicals
  corpus: nlm-chem
  corpus_args:
    id_mapping: ctd-chemicals

- name: nlm-chem.mesh
  kb: mesh
  kb_args:
    branches:
      - D
  corpus: nlm-chem
  corpus_args:
    id_mapping: mesh[D]

