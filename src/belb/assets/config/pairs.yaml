#####################################
# GENE
#####################################

- name: gnormplus.ncbi-gene
  kb: ncbi-gene
  kb_args:
    dedup_columns:
      - chr
  corpus: gnormplus

- name: gnormplus.ncbi-gene-subset
  kb: ncbi-gene
  kb_args:
    subset: gnormplus 
    dedup_columns:
      - chr
  corpus: gnormplus

- name: nlm-gene.ncbi-gene
  kb: ncbi-gene
  kb_args:
    dedup_columns:
      - chr
  corpus: nlm-gene

- name: nlm-gene.ncbi-gene-subset
  kb: ncbi-gene
  kb_args:
    subset: nlm-gene
    dedup_columns:
      - chr
  corpus: nlm-gene

